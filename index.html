<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedRacer - Car Racing Game</title>
    <link rel="stylesheet" href="style .css">
    <link href="https://fonts.googleapis.com/css2?family=Racing+Sans+One&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1>SPEED<span>RACER</span></h1>
            <div class="score-display">
                <span>Score: <span id="score">0</span></span>
                <span>High Score: <span id="high-score">0</span></span>
            </div>
        </header>
        
        <div class="game-area">
            <div id="road">
                <div id="player-car"></div>
                <div id="game-over">GAME OVER<br><button id="restart-btn">Play Again</button></div>
            </div>
            
            <div class="controls">
                <button id="start-btn">Start Game</button>
                <div class="mobile-controls">
                    <button id="left-btn">←</button>
                    <button id="right-btn">→</button>
                </div>
            </div>
        </div>
        
        <div class="instructions">
            <h2>How to Play</h2>
            <p>Use <strong>LEFT</strong> and <strong>RIGHT</strong> arrow keys to avoid traffic.</p>
            <p>Collect coins to increase your score.</p>
            <p>Don't crash into other cars!</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
